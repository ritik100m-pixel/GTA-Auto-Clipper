name: GTA Cloud Auto-Clipper

on:
  schedule:
    # Best-effort daily windows. GitHub may delay scheduled workflows during load.
    - cron: "0 4,16 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Maximum runner time in minutes (default 300; hard job timeout 345)"
        required: false
        default: "300"
        type: string
      target_clips:
        description: "Target quality clips for this batch"
        required: false
        default: "10"
        type: string
      dry_run:
        description: "Dry-run publishing (recommended until setup is verified)"
        required: true
        default: true
        type: boolean
      enable_publishing:
        description: "Allow publishing eligible clips"
        required: true
        default: false
        type: boolean
      unattended:
        description: "Allow unattended publishing for sources with explicit publish permission"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gta-cloud-autoclipper
  cancel-in-progress: false

jobs:
  cloud-autoclipper-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore persistent cloud state
        uses: actions/cache@v4
        with:
          path: |
            cloud_state/queue.sqlite3*
            cloud_state/analytics_ledger.json
            recordings
          key: cloud-clipper-state-${{ github.run_id }}
          restore-keys: |
            cloud-clipper-state-

      - name: Remove any legacy cached source allowlist
        run: rm -f cloud_state/source_allowlist.json

      - name: Execute cloud batch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GTA_SOURCE_ALLOWLIST_JSON: ${{ secrets.GTA_SOURCE_ALLOWLIST_JSON }}
          GTA_UNATTENDED_POSTS: ${{ secrets.GTA_UNATTENDED_POSTS }}
          GTA_ENABLE_PUBLISHING: ${{ vars.GTA_ENABLE_PUBLISHING }}
          GTA_DRY_RUN: ${{ vars.GTA_DRY_RUN }}
          INPUT_DURATION_MINUTES: ${{ inputs.duration_minutes }}
          INPUT_TARGET_CLIPS: ${{ inputs.target_clips }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENABLE_PUBLISHING: ${{ inputs.enable_publishing }}
          INPUT_UNATTENDED: ${{ inputs.unattended }}
        shell: bash
        run: |
          set -euo pipefail
          DURATION_MINUTES="${INPUT_DURATION_MINUTES:-300}"
          TARGET_CLIPS="${INPUT_TARGET_CLIPS:-10}"
          DRY_RUN_INPUT="${INPUT_DRY_RUN:-true}"
          ENABLE_PUBLISHING_INPUT="${INPUT_ENABLE_PUBLISHING:-false}"
          UNATTENDED_INPUT="${INPUT_UNATTENDED:-false}"

          # Scheduled runs use repository variables; all defaults are fail-closed.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DRY_RUN_INPUT="${GTA_DRY_RUN:-true}"
            ENABLE_PUBLISHING_INPUT="${GTA_ENABLE_PUBLISHING:-false}"
            if [ "$GTA_UNATTENDED_POSTS" = "1" ]; then
              UNATTENDED_INPUT="true"
            fi
          fi

          [[ "$DURATION_MINUTES" =~ ^[0-9]+$ ]] || { echo "duration_minutes must be an integer"; exit 2; }
          [[ "$TARGET_CLIPS" =~ ^[0-9]+$ ]] || { echo "target_clips must be an integer"; exit 2; }
          (( DURATION_MINUTES >= 1 && DURATION_MINUTES <= 330 )) || { echo "duration_minutes must be 1..330"; exit 2; }
          (( TARGET_CLIPS >= 1 && TARGET_CLIPS <= 20 )) || { echo "target_clips must be 1..20"; exit 2; }
          [[ "$DRY_RUN_INPUT" == "true" || "$DRY_RUN_INPUT" == "false" ]] || { echo "dry_run must be true or false"; exit 2; }
          [[ "$ENABLE_PUBLISHING_INPUT" == "true" || "$ENABLE_PUBLISHING_INPUT" == "false" ]] || { echo "enable_publishing must be true or false"; exit 2; }
          [[ "$UNATTENDED_INPUT" == "true" || "$UNATTENDED_INPUT" == "false" ]] || { echo "unattended must be true or false"; exit 2; }
          if [ "$UNATTENDED_INPUT" = "true" ] && [ "$ENABLE_PUBLISHING_INPUT" != "true" ]; then
            echo "unattended requires enable_publishing=true"; exit 2
          fi
          if [ "$UNATTENDED_INPUT" = "true" ] && [ "$GTA_UNATTENDED_POSTS" != "1" ]; then
            echo "unattended requires the GTA_UNATTENDED_POSTS=1 secret"; exit 2
          fi

          args=(--duration "$((DURATION_MINUTES * 60))" --target-clips "$TARGET_CLIPS")
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$ENABLE_PUBLISHING_INPUT" = "true" ]; then
            args+=(--enable-publishing)
          fi
          if [ "$UNATTENDED_INPUT" = "true" ]; then
            args+=(--unattended)
          fi

          python cloud_runner.py "${args[@]}"

      - name: Upload generated clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-clips-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload cloud state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-state-${{ github.run_number }}
          path: |
            cloud_state/queue.sqlite3*
            cloud_state/analytics_ledger.json
          if-no-files-found: ignore
          retention-days: 7
