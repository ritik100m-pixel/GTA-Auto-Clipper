name: Daily Gameplay Video to Shorts

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Choose how to provide the source video"
        required: true
        default: "github_release"
        type: choice
        options:
          - github_release
          - youtube_url
      video_url:
        description: "Optional unlisted YouTube URL (youtube_url mode only)"
        required: false
        type: string
      release_tag:
        description: "GitHub Release tag containing the uploaded video"
        required: false
        default: "gameplay-upload"
        type: string
      asset_name:
        description: "Exact uploaded video filename in the Release"
        required: false
        default: "gameplay.mp4"
        type: string
      confirm_rights:
        description: "I own this gameplay video or have explicit rights to edit and publish it"
        required: true
        default: false
        type: boolean
      target_clips:
        description: "Target number of quality Shorts (1-20)"
        required: true
        default: "10"
        type: string
      dry_run:
        description: "Preview only; do not upload or schedule"
        required: true
        default: true
        type: boolean
      enable_publishing:
        description: "Enable YouTube upload and scheduling"
        required: true
        default: false
        type: boolean
      unattended:
        description: "Allow automatic scheduling under the standing owner-channel permission"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gta-daily-gameplay-upload
  cancel-in-progress: false

jobs:
  process-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for yt-dlp
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore only non-media scheduling history
        uses: actions/cache@v4
        with:
          path: |
            cloud_state/analytics_ledger.json
            cloud_state/video_performance.json
          key: gta-scheduler-history-${{ github.run_id }}
          restore-keys: |
            gta-scheduler-history-

      - name: Download gameplay file from GitHub Release
        if: inputs.source_mode == 'github_release'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_ASSET_NAME: ${{ inputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$INPUT_RELEASE_TAG" ]] || { echo "A GitHub Release tag is required."; exit 2; }
          [[ -n "$INPUT_ASSET_NAME" ]] || { echo "A Release asset filename is required."; exit 2; }
          mkdir -p incoming
          gh release download "$INPUT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$INPUT_ASSET_NAME" --dir incoming
          test -s "incoming/$INPUT_ASSET_NAME" || { echo "Release asset not found. Check the tag and exact filename."; exit 2; }

      - name: Process the submitted gameplay video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GTA_OWNER_CHANNEL_ID: ${{ secrets.GTA_OWNER_CHANNEL_ID }}
          GTA_UNATTENDED_POSTS: ${{ secrets.GTA_UNATTENDED_POSTS }}
          INPUT_SOURCE_MODE: ${{ inputs.source_mode }}
          INPUT_VIDEO_URL: ${{ inputs.video_url }}
          INPUT_ASSET_NAME: ${{ inputs.asset_name }}
          INPUT_CONFIRM_RIGHTS: ${{ inputs.confirm_rights }}
          INPUT_TARGET_CLIPS: ${{ inputs.target_clips }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ENABLE_PUBLISHING: ${{ inputs.enable_publishing }}
          INPUT_UNATTENDED: ${{ inputs.unattended }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_SOURCE_MODE" == "youtube_url" ]]; then
            [[ -n "$INPUT_VIDEO_URL" ]] || { echo "A video URL is required."; exit 2; }
            echo "::add-mask::$INPUT_VIDEO_URL"
          elif [[ "$INPUT_SOURCE_MODE" == "github_release" ]]; then
            [[ -s "incoming/$INPUT_ASSET_NAME" ]] || { echo "The GitHub Release asset is missing."; exit 2; }
          else
            echo "Unknown source mode."
            exit 2
          fi
          [[ "$INPUT_CONFIRM_RIGHTS" == "true" ]] || {
            echo "Confirm ownership or explicit editing/publishing rights before processing."
            exit 2
          }
          [[ -n "$GTA_OWNER_CHANNEL_ID" ]] || {
            echo "Add the GTA_OWNER_CHANNEL_ID secret before running this workflow."
            exit 2
          }
          [[ "$INPUT_TARGET_CLIPS" =~ ^[0-9]+$ ]] || { echo "target_clips must be an integer."; exit 2; }
          (( INPUT_TARGET_CLIPS >= 1 && INPUT_TARGET_CLIPS <= 20 )) || {
            echo "target_clips must be between 1 and 20."
            exit 2
          }
          [[ "$INPUT_DRY_RUN" == "true" || "$INPUT_DRY_RUN" == "false" ]] || exit 2
          [[ "$INPUT_ENABLE_PUBLISHING" == "true" || "$INPUT_ENABLE_PUBLISHING" == "false" ]] || exit 2
          [[ "$INPUT_UNATTENDED" == "true" || "$INPUT_UNATTENDED" == "false" ]] || exit 2

          args=(--owner-channel-id "$GTA_OWNER_CHANNEL_ID"
                --confirm-rights
                --target-clips "$INPUT_TARGET_CLIPS")
          if [[ "$INPUT_SOURCE_MODE" == "youtube_url" ]]; then
            args+=(--url "$INPUT_VIDEO_URL")
          else
            args+=(--file "incoming/$INPUT_ASSET_NAME")
          fi

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$INPUT_ENABLE_PUBLISHING" = "true" ]; then
            args+=(--enable-publishing)
          fi
          if [ "$INPUT_UNATTENDED" = "true" ]; then
            args+=(--unattended)
          fi

          python process_uploaded_video.py "${args[@]}"

      - name: Delete all temporary video, clip, queue, and raw processing data
        if: always()
        run: |
          rm -rf output recordings work test_out incoming
          mkdir -p cloud_state
          find cloud_state -maxdepth 1 -type f \
            ! -name "analytics_ledger.json" \
            ! -name "video_performance.json" -delete
          find cloud_state -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
