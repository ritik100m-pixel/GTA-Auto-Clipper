name: YouTube Performance Snapshots

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore YouTube performance history
        uses: actions/cache@v4
        with:
          path: |
            cloud_state/analytics_ledger.json
            cloud_state/video_performance.json
          key: youtube-performance-${{ github.run_id }}
          restore-keys: |
            youtube-performance-
      - name: Collect due public performance snapshots
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python track_youtube_performance.py
