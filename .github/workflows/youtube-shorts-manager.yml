name: YouTube Shorts Manager

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'shorts_manager.py'
      - '.github/workflows/youtube-shorts-manager.yml'
      - 'docs/YOUTUBE-SHORTS-MANAGER.md'

permissions:
  contents: read

concurrency:
  group: youtube-shorts-manager
  cancel-in-progress: false

jobs:
  validate-manager:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile manager
        run: python -m py_compile shorts_manager.py

  manage-drive-queue:
    if: ${{ vars.SHORTS_MANAGER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore manager state
        uses: actions/cache@v4
        with:
          path: cloud_state/shorts_manager.json
          key: shorts-manager-state-${{ github.run_id }}
          restore-keys: |
            shorts-manager-state-
      - name: Install dependencies
        run: python -m pip install requests
      - name: Validate manager syntax
        run: python -m py_compile shorts_manager.py
      - name: Process one queued Short
        env:
          GDRIVE_INCOMING_FOLDER_ID: ${{ secrets.GDRIVE_INCOMING_FOLDER_ID }}
          GTA_OWNER_CHANNEL_ID: ${{ secrets.GTA_OWNER_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python shorts_manager.py
      - name: Save manager state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cloud_state/shorts_manager.json
          key: shorts-manager-state-${{ github.run_id }}
