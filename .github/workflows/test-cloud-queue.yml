name: Cloud Queue Tests

on:
  push:
    branches:
      - cloud-batch-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-cloud-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run persistent queue tests
        run: python -m unittest tests.test_cloud_queue -v
